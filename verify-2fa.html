<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f0e" />
    <title>Verify sign-in — afterhours</title>
    <script src="site-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="typography.css" />
    <link rel="stylesheet" href="site-theme.css" />
    <link rel="stylesheet" href="account-settings.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script defer src="verify-2fa.js"></script>
  </head>
  <body class="settings-body">
    <main class="settings-shell">
      <header class="settings-topbar"><a class="brand" href="./"><span class="brand-mark"><i></i><i></i><i></i></span><span>after<span class="brand-light">hours</span></span><span class="brand-dot"></span></a><a class="settings-back" href="./?view=login">← Back to sign in</a></header>
      <section class="settings-content verify-content">
        <div class="settings-heading"><span class="auth-eyebrow">ONE MORE STEP</span><h1>Check your email.</h1><p>Enter the 8-character code we sent you to finish signing in.</p></div>
        <section class="settings-card"><form class="settings-form" id="verifyForm"><label for="verificationCode">EMAIL VERIFICATION CODE</label><input class="auth-input verify-code" id="verificationCode" type="text" minlength="8" maxlength="8" pattern="[A-Za-z0-9]{8}" autocomplete="one-time-code" autocapitalize="characters" required /><p class="settings-feedback" id="verifyFeedback" role="status" aria-live="polite"></p><button class="auth-submit" id="verifySubmit" type="submit">Confirm code <span>↗</span></button></form></section>
      </section>
    </main>
    <div class="toast" id="verifyToast" role="status" aria-live="polite"></div>
  </body>
</html>
